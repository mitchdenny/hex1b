name: Deploy

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as a final release (only honored from a release/X.Y branch).'
        type: boolean
        default: false

# Serialize publishes per branch so that npm/NuGet pushes and tag/GH-release
# creation happen in commit order. PR builds get their own per-PR group so
# concurrent PRs do not block each other.
concurrency:
  group: >-
    deploy-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compute the build version exactly once and fan it out to every downstream
  # job. Computing per-job is unsafe: a tag created mid-run would desync the
  # build, publish and GitHub-release steps.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version
        id: v
        uses: ./.github/actions/version
        with:
          release-flag: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'false' }}

  build-web-terminal:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install web terminal dependencies
        working-directory: src/web-terminal
        run: npm ci --registry=https://registry.npmjs.org

      - name: Stamp the shared package version
        working-directory: src/web-terminal
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install web terminal sample dependencies
        run: npm ci --prefix samples/WebTerminalDemo --registry=https://registry.npmjs.org

      # The consumer build compiles the library, then checks the playground
      # types and copies its assets. Test and pack that same library build.
      - name: Build web terminal and sample consumer
        run: npm run build --prefix samples/WebTerminalDemo

      - name: Test web terminal
        working-directory: src/web-terminal
        run: npm test

      - name: Pack the tested web terminal
        working-directory: src/web-terminal
        run: |
          mkdir -p ../../artifacts/npm
          npm pack --ignore-scripts --pack-destination ../../artifacts/npm --registry=https://registry.npmjs.org

      - name: Verify npm artifact identity
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_KIND: ${{ needs.version.outputs.kind }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/publish-web-terminal.mjs --verify

      - name: Upload npm artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-web-terminal
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-web-terminal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build native library for tests
        if: runner.os != 'Windows'
        working-directory: src/Hex1b/native
        run: make

      - name: Restore dependencies
        run: |
          dotnet restore tests/Hex1b.Tests/Hex1b.Tests.csproj
          dotnet restore tests/Hex1b.Analyzers.Tests/Hex1b.Analyzers.Tests.csproj
          dotnet restore tests/Hex1b.McpServer.Tests/Hex1b.McpServer.Tests.csproj
          dotnet restore tests/Hex1b.Tool.Tests/Hex1b.Tool.Tests.csproj
          dotnet restore src/Hex1b.Tool/Hex1b.Tool.csproj

      - name: Build
        run: |
          dotnet build tests/Hex1b.Tests/Hex1b.Tests.csproj --no-restore
          dotnet build tests/Hex1b.Analyzers.Tests/Hex1b.Analyzers.Tests.csproj --no-restore
          dotnet build tests/Hex1b.McpServer.Tests/Hex1b.McpServer.Tests.csproj --no-restore
          dotnet build tests/Hex1b.Tool.Tests/Hex1b.Tool.Tests.csproj --no-restore
          dotnet build src/Hex1b.Tool/Hex1b.Tool.csproj --no-restore

      - name: Run tests
        timeout-minutes: 45
        run: |
          dotnet test tests/Hex1b.Tests/Hex1b.Tests.csproj \
            --no-build \
            -- --report-trx --report-trx-filename test-results.trx \
               --results-directory ./TestResults
          dotnet test tests/Hex1b.Analyzers.Tests/Hex1b.Analyzers.Tests.csproj \
            --no-build \
            -- --report-trx --report-trx-filename analyzer-test-results.trx \
               --results-directory ./TestResults
          dotnet test tests/Hex1b.McpServer.Tests/Hex1b.McpServer.Tests.csproj \
            --no-build \
            -- --report-trx --report-trx-filename mcp-test-results.trx \
               --results-directory ./TestResults
          dotnet test tests/Hex1b.Tool.Tests/Hex1b.Tool.Tests.csproj \
            --no-build \
            -- --report-trx --report-trx-filename tool-test-results.trx \
               --results-directory ./TestResults

      - name: Download and install Aspire CLI
        if: runner.os == 'Linux'
        run: |
          set -e
          curl -sSL https://aspire.dev/install.sh | bash -s
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Setup Node.js for content build
        if: runner.os == 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate API reference docs
        if: runner.os == 'Linux'
        run: dotnet run --project src/DocGenerator

      - name: Verify content build
        if: runner.os == 'Linux'
        run: |
          cd src/content
          npm install
          npm run build
          cd ../..
          aspire do build-content

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results (${{ runner.os }})
          path: ./TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: test-results-${{ runner.os }}
          path: ./TestResults/

      - name: Upload SVG attachments
        uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: svg-attachments-${{ runner.os }}
          path: tests/Hex1b.Tests/bin/Debug/net10.0/TestResults/svg/
          if-no-files-found: ignore

  # Build native libraries on each platform
  build-native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build native library
        working-directory: src/Hex1b/native
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64
          path: src/Hex1b/runtimes/linux-x64/native/libhex1binterop.so

  build-native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build native library
        working-directory: src/Hex1b/native
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-linux-arm64
          path: src/Hex1b/runtimes/linux-arm64/native/libhex1binterop.so

  build-native-osx-x64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build native library (cross-compile x86_64 from ARM64)
        working-directory: src/Hex1b/native
        run: make TARGET_ARCH=x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-osx-x64
          path: src/Hex1b/runtimes/osx-x64/native/libhex1binterop.dylib

  build-native-osx-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build native library
        working-directory: src/Hex1b/native
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-osx-arm64
          path: src/Hex1b/runtimes/osx-arm64/native/libhex1binterop.dylib

  build-pty-host-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows PTY shim
        shell: pwsh
        run: dotnet publish .\src\Hex1b.PtyHost\Hex1b.PtyHost.csproj -c Release -r win-x64 --nologo -p:PublishAot=true -p:SelfContained=true -o .\artifacts\pty-host\win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pty-host-windows-x64
          path: artifacts/pty-host/win-x64/

  build-pty-host-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows PTY shim
        shell: pwsh
        run: dotnet publish .\src\Hex1b.PtyHost\Hex1b.PtyHost.csproj -c Release -r win-arm64 --nologo -p:PublishAot=true -p:SelfContained=true -o .\artifacts\pty-host\win-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pty-host-windows-arm64
          path: artifacts/pty-host/win-arm64/

  build-pr:
    runs-on: ubuntu-latest
    needs: [version, build-web-terminal, test, build-native-linux-x64, build-native-linux-arm64, build-native-osx-x64, build-native-osx-arm64, build-pty-host-windows-x64, build-pty-host-windows-arm64]
    if: needs.version.outputs.kind == 'pr'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download native library - linux-x64
        uses: actions/download-artifact@v7
        with:
          name: native-linux-x64
          path: src/Hex1b/runtimes/linux-x64/native

      - name: Download native library - linux-arm64
        uses: actions/download-artifact@v7
        with:
          name: native-linux-arm64
          path: src/Hex1b/runtimes/linux-arm64/native

      - name: Download native library - osx-x64
        uses: actions/download-artifact@v7
        with:
          name: native-osx-x64
          path: src/Hex1b/runtimes/osx-x64/native

      - name: Download native library - osx-arm64
        uses: actions/download-artifact@v7
        with:
          name: native-osx-arm64
          path: src/Hex1b/runtimes/osx-arm64/native

      - name: Download PTY shim - win-x64
        uses: actions/download-artifact@v7
        with:
          name: pty-host-windows-x64
          path: src/Hex1b/runtimes/win-x64/native

      - name: Download PTY shim - win-arm64
        uses: actions/download-artifact@v7
        with:
          name: pty-host-windows-arm64
          path: src/Hex1b/runtimes/win-arm64/native

      - name: Verify native libraries
        run: |
          echo "Native libraries downloaded:"
          find src/Hex1b/runtimes -type f \( -name "*.so" -o -name "*.dylib" -o -name "hex1bpty.exe" -o -name "conpty.dll" -o -name "OpenConsole.exe" \) | xargs ls -la

      - name: Build and pack Hex1b (PR version for GH Packages)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b/Hex1b.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -o ./artifacts

      - name: Build and pack Hex1b.McpServer (PR version for GH Packages)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b.McpServer/Hex1b.McpServer.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -o ./artifacts

      - name: Restore Hex1b.Tool against packaged Hex1b (PR version for GH Packages)
        id: tool_pack_restore
        uses: ./.github/actions/restore-hex1b-tool-pack
        with:
          package-version: ${{ needs.version.outputs.version }}

      - name: Build and pack Hex1b.Tool (PR version for GH Packages)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b.Tool/Hex1b.Tool.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -p:UseHex1bPackageReference=true -p:Hex1bPackageVersion=${{ needs.version.outputs.version }} --configfile "${{ steps.tool_pack_restore.outputs.config_path }}" --no-restore -o ./artifacts

      - name: Extract and verify NuGet package contents
        run: bash .github/scripts/assert-nuget-contents.sh ./artifacts "${{ needs.version.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-pr
          path: ./artifacts/*.nupkg

  build-release:
    runs-on: ubuntu-latest
    needs: [version, build-web-terminal, test, build-native-linux-x64, build-native-linux-arm64, build-native-osx-x64, build-native-osx-arm64, build-pty-host-windows-x64, build-pty-host-windows-arm64]
    if: needs.version.outputs.kind != 'pr'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download native library - linux-x64
        uses: actions/download-artifact@v7
        with:
          name: native-linux-x64
          path: src/Hex1b/runtimes/linux-x64/native

      - name: Download native library - linux-arm64
        uses: actions/download-artifact@v7
        with:
          name: native-linux-arm64
          path: src/Hex1b/runtimes/linux-arm64/native

      - name: Download native library - osx-x64
        uses: actions/download-artifact@v7
        with:
          name: native-osx-x64
          path: src/Hex1b/runtimes/osx-x64/native

      - name: Download native library - osx-arm64
        uses: actions/download-artifact@v7
        with:
          name: native-osx-arm64
          path: src/Hex1b/runtimes/osx-arm64/native

      - name: Download PTY shim - win-x64
        uses: actions/download-artifact@v7
        with:
          name: pty-host-windows-x64
          path: src/Hex1b/runtimes/win-x64/native

      - name: Download PTY shim - win-arm64
        uses: actions/download-artifact@v7
        with:
          name: pty-host-windows-arm64
          path: src/Hex1b/runtimes/win-arm64/native

      - name: Verify native libraries
        run: |
          echo "Native libraries downloaded:"
          find src/Hex1b/runtimes -type f \( -name "*.so" -o -name "*.dylib" -o -name "hex1bpty.exe" -o -name "conpty.dll" -o -name "OpenConsole.exe" \) | xargs ls -la

      - name: Build and pack Hex1b (release version for NuGet.org)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b/Hex1b.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -o ./artifacts

      - name: Build and pack Hex1b.McpServer (release version for NuGet.org)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b.McpServer/Hex1b.McpServer.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -o ./artifacts

      - name: Restore Hex1b.Tool against packaged Hex1b (release version for NuGet.org)
        id: tool_pack_restore
        uses: ./.github/actions/restore-hex1b-tool-pack
        with:
          package-version: ${{ needs.version.outputs.version }}

      - name: Build and pack Hex1b.Tool (release version for NuGet.org)
        env:
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Hex1b.Tool/Hex1b.Tool.csproj -c Release -p:PackageVersion=${{ needs.version.outputs.version }} -p:UseHex1bPackageReference=true -p:Hex1bPackageVersion=${{ needs.version.outputs.version }} --configfile "${{ steps.tool_pack_restore.outputs.config_path }}" --no-restore -o ./artifacts

      - name: Extract and verify NuGet package contents
        run: bash .github/scripts/assert-nuget-contents.sh ./artifacts "${{ needs.version.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-release
          path: ./artifacts/*.nupkg

  publish-pr:
    runs-on: ubuntu-latest
    needs: [version, build-pr]
    # Review-only PRs can opt out without skipping build, test, or pack checks.
    # Keep this marker in the PR body: <!-- hex1b:skip-preview-publish -->
    if: >-
      needs.version.outputs.kind == 'pr' &&
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.body, '<!-- hex1b:skip-preview-publish -->') &&
      github.repository == 'mitchdenny/hex1b' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages-pr
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Post package info to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          
          # Delete previous package comments to avoid noise
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json comments \
            --jq '.comments[]? | select(.body | startswith("## 📦 PR Package Published")) | .databaseId' 2>/dev/null | \
          while IFS= read -r comment_id; do
            if [ -n "$comment_id" ]; then
              echo "Deleting old package comment: $comment_id"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${{ github.repository }}/issues/comments/$comment_id" || true
            fi
          done

          # Create comment body
          cat > artifacts/pr_comment.md << EOF
          ## 📦 PR Packages Published

          NuGet preview packages for this PR have been published to GitHub Packages.

          ### Package Version
          \`${PACKAGE_VERSION}\`

          ### Packages

          | Package | Description |
          |---------|-------------|
          | Hex1b | Core TUI library |
          | Hex1b.McpServer | MCP server for terminal session management |
          | Hex1b.Tool | CLI tool for terminal management and diagnostics |

          ### Usage Examples

          **Browser client (downloadable workflow artifact):**

          The npm package is not published to a registry for PRs. Download the
          \`npm-web-terminal\` artifact from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}),
          or use the GitHub CLI:

          \`\`\`bash
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name npm-web-terminal --dir artifacts/npm
          npm install ./artifacts/npm/hex1b-web-terminal-${PACKAGE_VERSION}.tgz --save-exact
          \`\`\`

          Use this tarball alongside the matching Hex1b NuGet packages.
          See the [publishing guide](https://github.com/mitchdenny/hex1b/blob/${{ github.event.pull_request.head.sha }}/docs/web-terminal-publishing.md).

          **Hex1b - PackageReference (csproj):**
          \`\`\`xml
          <PackageReference Include="Hex1b" Version="${PACKAGE_VERSION}" />
          \`\`\`

          **Hex1b - .NET CLI:**
          \`\`\`bash
          dotnet add package Hex1b --version ${PACKAGE_VERSION}
          \`\`\`

          **Hex1b.McpServer - Install as global tool:**
          \`\`\`bash
          dotnet tool install -g Hex1b.McpServer --version ${PACKAGE_VERSION}
          \`\`\`

          **Hex1b.Tool - Install as global tool:**
          \`\`\`bash
          dotnet tool install -g Hex1b.Tool --version ${PACKAGE_VERSION}
          \`\`\`

          Once installed, the tool is available as:
          \`\`\`bash
          hex1b terminal list
          hex1b capture <id> --format svg
          hex1b keys <id> --key Enter
          \`\`\`

          ### NuGet Configuration

          To use this package, you need to configure a NuGet.config file with the GitHub Packages feed:

          \`\`\`xml
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <!--To inherit the global NuGet package sources remove the <clear/> line below -->
              <clear />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
              <add key="github-mitchdenny" value="https://nuget.pkg.github.com/mitchdenny/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget">
                <package pattern="*" />
              </packageSource>
              <packageSource key="github-mitchdenny">
                <package pattern="Hex1b*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          \`\`\`

          ### Authentication

          GitHub Packages requires authentication. Make sure your GitHub CLI has the \`read:packages\` scope:

          \`\`\`bash
          # Check current scopes
          gh auth status

          # If needed, refresh with packages scope
          gh auth refresh -s read:packages

          # Configure NuGet to use GitHub auth
          dotnet nuget update source github-mitchdenny \\
            --username YOUR_GITHUB_USERNAME \\
            --password \$(gh auth token) \\
            --store-password-in-clear-text
          \`\`\`

          ---
          *Package published at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

          # Strip leading spaces
          sed -i 's/^          //' artifacts/pr_comment.md

          # Post comment to PR
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file artifacts/pr_comment.md \
            --repo ${{ github.repository }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [version, build-release]
    if: needs.version.outputs.kind != 'pr' && github.repository == 'mitchdenny/hex1b'
    environment: production
    permissions:
      contents: write
      id-token: write
      actions: write  # so the post-release step can dispatch baseline-bump.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages-release
          path: ./artifacts

      - name: Download npm artifact
        uses: actions/download-artifact@v7
        with:
          name: npm-web-terminal
          path: artifacts/npm

      - name: Setup Node.js for npm trusted publishing
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            const [major, minor, patch] = version.split(".").map(Number);
            if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
              throw new Error(`npm >= 11.5.1 is required for trusted publishing; found ${version}`);
            }
            console.log(`Using npm ${version} for trusted publishing`);
          '

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Skip stale beta if final tag now exists
        id: stale-check
        if: needs.version.outputs.kind == 'beta'
        run: |
          set -euo pipefail
          # If a final vX.Y.Z release for this same base shipped while this
          # beta was in flight, do not publish the now-stale beta.
          git fetch --tags --quiet
          BASE="${{ needs.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
            echo "Tag v${BASE} already exists; skipping stale beta publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Publish npm first: a failed npm push must not leave NuGet published
      # while preventing the GitHub release on a retry. Reuse the built tarball.
      - name: Publish to npmjs with trusted publishing
        if: vars.NPM_PUBLISH_ENABLED == 'true' && steps.stale-check.outputs.skip != 'true'
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_KIND: ${{ needs.version.outputs.kind }}
        run: node .github/scripts/publish-web-terminal.mjs

      - name: Check if packages exist on NuGet.org
        id: check-package
        if: steps.stale-check.outputs.skip != 'true'
        run: |
          PACKAGE_VERSION="${{ needs.version.outputs.version }}"
          
          # Check Hex1b
          echo "Checking if Hex1b version $PACKAGE_VERSION exists on NuGet.org..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/hex1b/$PACKAGE_VERSION/hex1b.nuspec")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Hex1b version $PACKAGE_VERSION already exists on NuGet.org"
            echo "hex1b-exists=true" >> $GITHUB_OUTPUT
          else
            echo "Hex1b version $PACKAGE_VERSION does not exist on NuGet.org"
            echo "hex1b-exists=false" >> $GITHUB_OUTPUT
          fi
          
          # Check Hex1b.McpServer
          echo "Checking if Hex1b.McpServer version $PACKAGE_VERSION exists on NuGet.org..."
          HTTP_CODE_MCP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/hex1b.mcpserver/$PACKAGE_VERSION/hex1b.mcpserver.nuspec")
          
          if [ "$HTTP_CODE_MCP" = "200" ]; then
            echo "Hex1b.McpServer version $PACKAGE_VERSION already exists on NuGet.org"
            echo "mcpserver-exists=true" >> $GITHUB_OUTPUT
          else
            echo "Hex1b.McpServer version $PACKAGE_VERSION does not exist on NuGet.org"
            echo "mcpserver-exists=false" >> $GITHUB_OUTPUT
          fi
          
          # Check Hex1b.Tool
          echo "Checking if Hex1b.Tool version $PACKAGE_VERSION exists on NuGet.org..."
          HTTP_CODE_TOOL=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/hex1b.tool/$PACKAGE_VERSION/hex1b.tool.nuspec")
          
          if [ "$HTTP_CODE_TOOL" = "200" ]; then
            echo "Hex1b.Tool version $PACKAGE_VERSION already exists on NuGet.org"
            echo "tool-exists=true" >> $GITHUB_OUTPUT
          else
            echo "Hex1b.Tool version $PACKAGE_VERSION does not exist on NuGet.org"
            echo "tool-exists=false" >> $GITHUB_OUTPUT
          fi
          
          # Set combined flag - only skip if ALL exist
          if [ "$HTTP_CODE" = "200" ] && [ "$HTTP_CODE_MCP" = "200" ] && [ "$HTTP_CODE_TOOL" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to NuGet
        if: steps.check-package.outputs.exists == 'false'
        uses: nuget/login@v1
        id: nugetlogin
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push to NuGet.org
        if: steps.check-package.outputs.exists == 'false'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nugetlogin.outputs.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        if: needs.version.outputs.kind == 'release' && steps.check-package.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Create release notes
          cat > artifacts/release_notes.md << EOF
          ## Hex1b v${PACKAGE_VERSION}

          ### Packages

          | Package | Description |
          |---------|-------------|
          | [Hex1b](https://www.nuget.org/packages/Hex1b/${PACKAGE_VERSION}) | Core TUI library |
          | [Hex1b.McpServer](https://www.nuget.org/packages/Hex1b.McpServer/${PACKAGE_VERSION}) | MCP server for terminal session management |
          | [Hex1b.Tool](https://www.nuget.org/packages/Hex1b.Tool/${PACKAGE_VERSION}) | CLI tool for terminal management and diagnostics |

          ### Installation

          **Hex1b (library):**
          \`\`\`bash
          dotnet add package Hex1b --version ${PACKAGE_VERSION}
          \`\`\`

          **Hex1b.McpServer (global tool):**
          \`\`\`bash
          dotnet tool install -g Hex1b.McpServer --version ${PACKAGE_VERSION}
          \`\`\`

          **Hex1b.Tool (global tool):**
          \`\`\`bash
          dotnet tool install -g Hex1b.Tool --version ${PACKAGE_VERSION}
          \`\`\`

          ### Links
          - 📦 [Hex1b on NuGet](https://www.nuget.org/packages/Hex1b/${PACKAGE_VERSION})
          - 🔧 [Hex1b.McpServer on NuGet](https://www.nuget.org/packages/Hex1b.McpServer/${PACKAGE_VERSION})
          - 🛠️ [Hex1b.Tool on NuGet](https://www.nuget.org/packages/Hex1b.Tool/${PACKAGE_VERSION})
          - 📖 [Documentation](https://hex1b.dev)
          - 🌐 [Web terminal package and publishing guide](https://github.com/mitchdenny/hex1b/blob/main/docs/web-terminal-publishing.md)

          When npm publishing is enabled, \`@hex1b/web-terminal\` uses this same
          version on npmjs. It is an experimental HWT1 client paired with Hex1b.

          ---
          *Released from commit ${{ github.sha }}*
          EOF

          # Attach both distributions from the same versioned build.
          gh release create "v${PACKAGE_VERSION}" \
            --target "${{ github.sha }}" \
            --title "v${PACKAGE_VERSION}" \
            --notes-file artifacts/release_notes.md \
            ./artifacts/*.nupkg ./artifacts/npm/*.tgz

      - name: Dispatch baseline-bump workflow
        # The release above is created via GITHUB_TOKEN, so the resulting
        # `release: published` event will NOT cascade to other workflows
        # (events triggered by GITHUB_TOKEN don't start new workflow runs).
        # workflow_dispatch is one of the documented exceptions, so we kick
        # baseline-bump.yml explicitly here. Runs against the default branch
        # so the latest bump rules and rewrite script are used regardless of
        # which release/X.Y branch shipped this release.
        if: needs.version.outputs.kind == 'release' && steps.check-package.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh workflow run baseline-bump.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="${PACKAGE_VERSION}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [version, publish-release]
    # Production only redeploys for final releases (workflow_dispatch on a
    # release/X.Y branch with release=true). Alpha and beta builds publish
    # packages but do not redeploy production.
    if: needs.version.outputs.kind == 'release'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download and install Aspire CLI
        run: |
          set -e
          curl -sSL https://aspire.dev/install.sh | bash -s -- -q dev
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Show Aspire CLI version
        run: |
          set -e
          aspire --version

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run aspire deploy
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
          AZURE__SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE__LOCATION: 'westus3'
          AZURE__RESOURCEGROUP: 'hex1b-production'
          Parameters__customDomain: ${{ vars.CUSTOM_DOMAIN }}
          Parameters__certificateName: ${{ secrets.CERTIFICATE_NAME }}
          Parameters__minReplicas: '1'
          HEX1B_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          aspire deploy --debug
