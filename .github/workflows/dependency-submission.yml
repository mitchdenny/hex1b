name: Dependency Submission

# Replaces the managed NuGet submission after it is disabled in repository
# settings; the managed workflow does not expose directory exclusions.
on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # NuGet detection reads restored assets; this repository has no root solution.
      - name: Restore NuGet dependencies
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet restore "$project"
          done < <(git ls-files -z -- '*.csproj' '*.fsproj' \
            ':(exclude)samples/BlazorDemo/**' \
            ':(exclude)samples/BlazorPerfStressDemo/**' \
            ':(exclude)samples/WasmDemo/**')

      - name: Submit NuGet dependencies
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        with:
          fail-on-empty: 'true'
          detectorsCategories: NuGet
          directoryExclusionList: samples/BlazorDemo;samples/BlazorPerfStressDemo;samples/WasmDemo
