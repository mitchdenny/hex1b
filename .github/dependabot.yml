version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    groups:
      skiasharp:
        patterns:
          - "SkiaSharp*"
      aspire:
        patterns:
          - "Aspire.*"
    # These versions are compatibility/runtime pins, not routine update targets.
    ignore:
      - dependency-name: "Hex1b"
      - dependency-name: "Docfx.App"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.MSBuild"
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directories:
      - "/src/content"
      - "/src/web-terminal"
      - "/samples/WebTerminalDemo"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
